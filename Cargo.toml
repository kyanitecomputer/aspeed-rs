[workspace]
members = [
    "aspeed-mmio",
    "embassy-aspeed",
]
resolver = "2"

[profile.release]
debug = true       # Keep debug info for RTT / probe-rs
opt-level = "s"    # Optimize for size on embedded target
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
opt-level = 1
panic = "abort"

# ── Shared dependency versions ────────────────────────────────────────────────
# Embassy crates must come from the same git rev to guarantee ABI compatibility.
[workspace.dependencies]
embassy-executor         = { git = "https://github.com/embassy-rs/embassy" }
embassy-time             = { git = "https://github.com/embassy-rs/embassy" }
embassy-time-driver      = { git = "https://github.com/embassy-rs/embassy" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy" }
embassy-sync             = { git = "https://github.com/embassy-rs/embassy" }
embassy-hal-internal     = { git = "https://github.com/embassy-rs/embassy", features = [] }

cortex-m    = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"

defmt      = "0.3"
defmt-rtt  = "0.4"
panic-halt = "0.2"
log        = { version = "0.4", default-features = false }

embedded-hal       = "1"
embedded-hal-async = "1"
embedded-io        = "0.6"
embedded-io-async  = "0.6"

critical-section = "1"
