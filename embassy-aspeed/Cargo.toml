[package]
name        = "embassy-aspeed"
version     = "0.1.0"
edition     = "2021"
description = "Embassy async HAL for ASPEED AST10xx/AST26xx/AST27xx coprocessors and standalone SoCs"
repository  = "https://github.com/kyanitecomputer/aspeed-rs"
publish     = false

# ── Feature flags ──────────────────────────────────────────────────────────────
[features]
default = []

# Chip + core target. Exactly one must be enabled.
ast2600-ssp = [
    "aspeed-pac/ast2600",
    "aspeed-mmio/async",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "dep:embassy-executor",
    "embassy-executor?/platform-cortex-m",
    "dep:embassy-time",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "dep:embassy-hal-internal",
]

ast1060 = [
    "aspeed-pac/ast1060",
    "aspeed-mmio/async",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "dep:embassy-executor",
    "embassy-executor?/platform-cortex-m",
    "dep:embassy-time",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "dep:embassy-hal-internal",
]

ast2700-bootmcu = [
    "aspeed-pac/ast2700-bootmcu",
    "aspeed-mmio/async",
    "dep:riscv",
    "dep:riscv-rt",
    "dep:embassy-executor",
    "embassy-executor?/platform-riscv32",
    "dep:embassy-time",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "dep:embassy-hal-internal",
    "lz4",
]

# LZ4 block decompression for A2 payload loading. Pulls in lz4_flex (which links
# `alloc` unconditionally), so any binary enabling this must supply a global
# allocator. Kept optional so the cortex-m (ast1060/ast2600-ssp) no-alloc builds
# are unaffected.
lz4 = ["dep:lz4_flex"]

# `log`-crate global logger over UART12 (AST2700 BootMCU). The uniform logging
# path; the `log` crate itself is always available (see [dependencies]).
log-uart = []

# ── Dependencies ───────────────────────────────────────────────────────────────
[dependencies]
# Generated PAC — relative path to aspeed-data sibling repo.
# Post-push: switch to git = "https://github.com/kyanitecomputer/aspeed-data", rev = "<sha>"
aspeed-pac  = { path = "../../aspeed-data/aspeed-pac" }
aspeed-mmio = { path = "../aspeed-mmio" }

embassy-executor         = { workspace = true, features = ["executor-thread"], optional = true }
embassy-time             = { workspace = true, features = ["tick-hz-1_000_000"], optional = true }
embassy-time-driver      = { workspace = true, optional = true }
embassy-time-queue-utils = { workspace = true, optional = true }
embassy-sync             = { workspace = true }
embassy-hal-internal     = { workspace = true, optional = true }

cortex-m    = { workspace = true, optional = true }
cortex-m-rt = { workspace = true, optional = true }

riscv    = { version = "0.11", features = ["critical-section-single-hart"], optional = true }
riscv-rt = { version = "0.12", optional = true }

# Safe (no `unsafe`) LZ4 block decoder for A2 payload decompression. Decode-only
# on target; the encoder is used only by host tests and is DCE'd from firmware.
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"], optional = true }

log = { workspace = true }

embedded-hal       = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-io        = { workspace = true }
embedded-io-async  = { workspace = true }

critical-section = { workspace = true }

[target.'cfg(target_arch = "arm")'.dev-dependencies]
panic-halt = "0.2"

[target.'cfg(target_arch = "riscv32")'.dev-dependencies]
panic-halt = "0.2"
